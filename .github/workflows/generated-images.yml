name: Generated images
on:
  # 매일 00:00 UTC(한국 09:00) 갱신
  schedule: [{ cron: "0 0 * * *" }]
  # Actions 탭에서 수동 실행
  workflow_dispatch:
  # main push 시 갱신 (생성기나 설정을 고친 결과를 바로 반영)
  push: { branches: ["main"] }

# 발행은 output 브랜치를 통째로 교체한다. 실행이 겹치면 먼저 시작한 쪽이 나중에 끝나
# 더 오래된 결과로 덮을 수 있으므로, 새 실행이 시작되면 진행 중인 실행을 취소한다.
concurrency:
  group: generated-images
  cancel-in-progress: true

jobs:
  # metrics와 조직 카드를 한 job에서 생성해 한 번에 발행한다. 워크플로를 나눠 같은 브랜치에
  # 따로 발행하면 나중에 발행한 쪽이 앞의 파일을 삭제한다(발행이 브랜치를 통째로 교체하므로).
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # 구성/필터 정책과 근거는 저장소 루트 PROJECT.md 참고
      - uses: lowlighter/metrics@latest
        with:
          # Settings > Secrets에 등록한 PAT
          token: ${{ secrets.METRICS_TOKEN }}

          # 커밋하지 않고 러너의 /metrics_renders/<filename>에 파일만 생성한다.
          # 기본값(commit)은 실행마다 main에 봇 커밋을 만든다.
          output_action: none
          filename: github-metrics.svg

          # 헤더만 유지 (약점 지표 섹션 제외, 강점은 아래 플러그인으로)
          base: header
          config_timezone: Asia/Seoul
          # fork 리포는 통계에서 제외
          repositories_forks: no

          # 입체 커밋 캘린더 (꾸준한 실행력 시각화)
          # half-year: 잔디가 작게 가로로 깔리고 스트릭/커밋 통계가 오른쪽에 붙는 컴팩트 레이아웃
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # 코드 작성량
          plugin_lines: yes

          # 사용 언어 분포
          plugin_languages: yes
          # indepth는 단일 언어로 왜곡되므로 미사용
          plugin_languages_indepth: no
          # 언어 옆에 바이트/비율 표시
          plugin_languages_details: bytes-size, percentage
          # 프로그래밍/마크업 언어만
          plugin_languages_categories: markup, programming
          # 1% 미만 언어 숨김
          plugin_languages_threshold: 1%
          # 상위 8개만 표시
          plugin_languages_limit: 8
          # 언어 통계 제외 목록. @use.patterns는 첫 줄 필수, 블록 안엔 패턴만.
          plugin_languages_skipped: |-
            @use.patterns
            siakun-private/*
            siakun-forks/*
            bit-flo/*
            siakun/notedrop-share
            siakun/LetterAI

      # METRICS_TOKEN으로 조직의 공개/비공개 리포 수를 읽어 generated/에 카드 SVG를 생성
      - name: Generate org cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: bash scripts/gen-org-cards.sh

      - name: Collect metrics render
        run: cp /metrics_renders/github-metrics.svg generated/

      - name: Publish to output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/publish-generated.sh
